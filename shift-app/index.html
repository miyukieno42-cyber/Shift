
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフト">
<title>シフト管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b33; --sub:#5d6d75; --line:#d5dde0; --bg:#f2f5f6; --card:#fff;
  --main:#0f6b73; --main-d:#0b4f55;
  --s1:#0f6b73; --s1t:#fff;
  --s2:#cfe7ea; --s2t:#0b4249;
  --s3:#d6edc9; --s3t:#2a5512;
  --s4:#f8d6cd; --s4t:#8a2c18;
  --s5:#e1e3e4; --s5t:#555;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #f0b429;outline-offset:2px}

/* ログイン */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 2px 14px rgba(15,60,70,.12)}
.login-box h1{margin:0 0 4px;font-size:22px}
.login-box p{margin:0 0 18px;color:var(--sub);font-size:14px}
.login-box input{width:100%;height:52px;font-size:18px;padding:0 14px;border:2px solid var(--line);border-radius:10px;margin-bottom:12px}
.login-box .primary{width:100%}
.err{color:#b3321b;font-size:14px;min-height:1.4em;margin:0 0 8px}

.primary{height:52px;padding:0 22px;border:0;border-radius:10px;background:var(--main);color:#fff;font-size:18px;font-weight:700}
.primary:active{background:var(--main-d)}
.ghost{height:44px;padding:0 16px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px}

/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar h1{margin:0;font-size:18px;flex:1}
.status{font-size:13px;color:var(--sub);border:0;background:none;padding:6px 8px;border-radius:8px}
.status.err-state{background:#fbe3dd;color:#8a2c18;font-weight:700}
.monthnav{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
.monthnav .label{flex:1;text-align:center;font-size:20px;font-weight:700}
.monthnav button{height:44px;min-width:48px;border:2px solid var(--line);background:#fff;border-radius:10px;font-size:18px}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;height:48px;border:0;background:none;font-size:16px;color:var(--sub);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--main-d);font-weight:700;border-bottom-color:var(--main)}

main{padding:10px 10px 40px}
.hint{font-size:13px;color:var(--sub);margin:2px 4px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.legend span{font-size:12px;padding:2px 8px;border-radius:6px}

/* シフト表 */
.gridwrap{overflow:auto;max-height:calc(100dvh - 235px);min-height:260px;background:#fff;border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:separate;border-spacing:0}
table.grid th,table.grid td{padding:0;border-bottom:1px solid var(--line);background:#fff}
table.grid th.name{position:sticky;left:0;z-index:2;min-width:96px;max-width:120px;text-align:left;padding:4px 8px;font-size:15px;border-right:2px solid var(--line);background:#fff}
table.grid thead th{position:sticky;z-index:3;background:#fff}
table.grid thead tr.r1 th{top:0;height:54px}
table.grid thead tr.r2 th{top:54px;height:26px;font-size:12px;color:var(--sub);font-weight:400}
table.grid thead th.name{z-index:5;top:0;vertical-align:middle}
table.grid th.name small{display:block;font-size:11px;color:var(--sub);font-weight:400;line-height:1.2}
table.grid th.day{border-left:2px solid var(--line)}
table.grid td.am{border-left:2px solid var(--line)}
.daybtn{display:block;width:100%;height:54px;border:0;background:none;font-size:17px;font-weight:700;line-height:1.1;padding:4px 0}
.daybtn small{display:block;font-size:12px;font-weight:400}
.wd0 .daybtn{color:#c0392b}
.wd6 .daybtn{color:#1f5fbf}
table.grid th.day.today{box-shadow:inset 0 -4px 0 var(--main)}
table.grid th.day.closed{background:var(--s5)}
.daybtn em{display:block;font-style:normal;font-size:11px;color:var(--s5t)}
td.closed{opacity:.4}
.cell{width:40px;height:42px;margin:0;border:0;border-bottom:1px solid #fff;background:#fff;font-size:17px;font-weight:700;color:var(--sub)}
.cell.s1{background:var(--s1);color:var(--s1t)}
.cell.s2{background:var(--s2);color:var(--s2t)}
.cell.s3{background:var(--s3);color:var(--s3t)}
.cell.s4{background:var(--s4);color:var(--s4t)}
.cell.s5{background:var(--s5);color:var(--s5t)}

/* 選択シート */
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{height:60px;font-size:19px;font-weight:700;border-radius:12px;border:3px solid transparent}
.opt.s1{background:var(--s1);color:var(--s1t)}
.opt.s2{background:var(--s2);color:var(--s2t)}
.opt.s3{background:var(--s3);color:var(--s3t)}
.opt.s4{background:var(--s4);color:var(--s4t)}
.opt.s5{background:var(--s5);color:var(--s5t)}
.opt.clear{background:#fff;border-color:var(--line);color:var(--sub)}
.opt.now{border-color:var(--ink)}
.sheet .close{width:100%;margin-top:12px}

/* カレンダー */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{text-align:center;font-weight:700;font-size:14px;padding:4px 0}
.cal .wh.sun{color:#c0392b}.cal .wh.sat{color:#1f5fbf}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:104px;padding:4px;font-size:12px;overflow:hidden}
.cal .d.blank{background:transparent;border-color:transparent}
.cal .d.today{border:2px solid var(--main)}
.cal .d.closed{background:var(--s5)}
.cal .n{font-weight:700;font-size:14px}
.cal .d.sun .n{color:#c0392b}.cal .d.sat .n{color:#1f5fbf}
.cal .row{margin-top:3px;line-height:1.35;word-break:break-all}
.cal .row b{display:inline-block;font-size:10px;background:var(--s2);color:var(--s2t);border-radius:4px;padding:0 4px;margin-right:3px}
.cal .row.pm b{background:#e7dcf3;color:#4a2a73}
.cal .off{color:var(--s5t);margin-top:6px}
@media (max-width:640px){
  .cal .d{min-height:92px;font-size:11px;padding:3px}
}

/* スタッフ */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.staff-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.staff-row:last-child{border-bottom:0}
.staff-row input{height:44px;font-size:16px;padding:0 10px;border:2px solid var(--line);border-radius:8px;width:100%}
.staff-row .memo{grid-column:1 / 2}
.staff-row .btns{display:flex;gap:6px;grid-column:2 / 3;grid-row:1 / 3;align-items:center}
.staff-row .btns button{width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:8px;font-size:16px}
.staff-row .btns .del{width:auto;padding:0 10px;color:#8a2c18;border-color:#f0c1b6}
.add{display:flex;gap:8px}
.add input{flex:1;height:48px;font-size:16px;padding:0 12px;border:2px solid var(--line);border-radius:10px}
.add button{height:48px}
.logout{margin-top:8px}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login-box">
    <h1>シフト管理</h1>
    <p>パスワードを入力してください</p>
    <input id="pwInput" type="password" autocomplete="current-password" aria-label="パスワード">
    <p class="err" id="loginErr"></p>
    <button class="primary" id="loginBtn">開く</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <h1>シフト管理</h1>
      <button class="status" id="status" type="button" aria-live="polite"></button>
    </div>
    <div class="monthnav">
      <button id="prev" aria-label="前の月">‹</button>
      <div class="label" id="monthLabel"></div>
      <button id="today">今月</button>
      <button id="next" aria-label="次の月">›</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="grid" aria-selected="true">シフト入力</button>
      <button role="tab" data-tab="cal" aria-selected="false">カレンダー</button>
      <button role="tab" data-tab="staff" aria-selected="false">スタッフ</button>
    </div>
  </header>

  <main>
    <section id="view-grid">
      <div class="legend" id="legend"></div>
      <div class="hint">マスをタップして選びます。日付をタップすると、その日を休業日にできます。</div>
      <div class="gridwrap" id="gridWrap"></div>
    </section>

    <section id="view-cal" hidden>
      <div class="hint">「出勤」に選んだ人が表示されます。</div>
      <div class="cal" id="cal"></div>
    </section>

    <section id="view-staff" hidden>
      <div class="card">
        <div id="staffList"></div>
      </div>
      <div class="card">
        <div class="add">
          <input id="newName" placeholder="追加する名前" aria-label="追加する名前">
          <button class="primary" id="addBtn">追加</button>
        </div>
      </div>
      <button class="ghost logout" id="logout">ログアウト</button>
    </section>
  </main>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <p id="sheetSub"></p>
    <div class="opts" id="opts"></div>
    <button class="ghost close" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- 設定 ---------- */
var STATUS = [
  {v:'出勤',     s:'出', c:'s1'},
  {v:'勤務可能', s:'可', c:'s2'},
  {v:'希望○',   s:'○', c:'s3'},
  {v:'希望×',   s:'×', c:'s4'},
  {v:'休み',     s:'休', c:'s5'}
];
var DEFAULT_STAFF = ['白井さん','葉山さん','ゆいちゃん','かじさん','山田さん','ふうかちゃん','大羽さん'];
var WD = ['日','月','火','水','木','金','土'];

/* ---------- 状態 ---------- */
var pw = '';
try { pw = localStorage.getItem('shift_pw') || ''; } catch(e) {}
var now = new Date();
var ym = {y: now.getFullYear(), m: now.getMonth() + 1};
var staff = [];
var month = {shifts:{}, closed:{}};
var tab = 'grid';
var target = null;
var pending = new Map();
var saveTimer = null;

/* ---------- 便利関数 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function newId(){ return 's' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function mkey(){ return 'month:' + ym.y + '-' + pad(ym.m); }
function daysIn(){ return new Date(ym.y, ym.m, 0).getDate(); }
function statusOf(v){ for (var i = 0; i < STATUS.length; i++) if (STATUS[i].v === v) return STATUS[i]; return null; }
function isToday(d){ return now.getFullYear() === ym.y && now.getMonth() + 1 === ym.m && now.getDate() === d; }

/* ---------- API ---------- */
async function api(method, key, value){
  var opt = {method: method, headers: {'x-app-password': encodeURIComponent(pw)}};
  if (value !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify({value: value});
  }
  var r = await fetch('/api/data?key=' + encodeURIComponent(key), opt);
  if (r.status === 401) { var e = new Error('auth'); e.auth = true; throw e; }
  if (!r.ok) {
    var msg = 'http ' + r.status;
    try { var j = await r.json(); if (j && j.error) msg = j.error; } catch(x) {}
    throw new Error(msg);
  }
  return r.json();
}

/* ---------- 保存 ---------- */
function setStatus(text, kind){
  var el = $('#status');
  el.textContent = text;
  el.className = 'status' + (kind === 'err' ? ' err-state' : '');
}
function queue(key, value){
  pending.set(key, value);
  setStatus('保存中…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush(){
  clearTimeout(saveTimer);
  if (pending.size === 0) return;
  var items = Array.from(pending.entries());
  pending.clear();
  try {
    for (var i = 0; i < items.length; i++) await api('PUT', items[i][0], items[i][1]);
    if (pending.size === 0) setStatus('保存しました');
  } catch (e) {
    items.forEach(function(it){ if (!pending.has(it[0])) pending.set(it[0], it[1]); });
    if (e.auth) { showLogin('パスワードが違います'); return; }
    setStatus('保存できません(タップでやり直し)', 'err');
  }
}
$('#status').addEventListener('click', function(){ if (pending.size) flush(); });
window.addEventListener('beforeunload', function(e){
  if (pending.size) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- 読み込み ---------- */
async function loadMonth(){
  var r = await api('GET', mkey());
  month = (r.value && typeof r.value === 'object') ? r.value : {};
  month.shifts = month.shifts || {};
  month.closed = month.closed || {};
}
async function loadAll(){
  var s = await api('GET', 'staff');
  if (s.value && Array.isArray(s.value)) {
    staff = s.value;
  } else {
    staff = DEFAULT_STAFF.map(function(n){ return {id:newId(), name:n, memo:''}; });
    queue('staff', staff);
  }
  await loadMonth();
}

/* ---------- 画面切り替え ---------- */
function showLogin(msg){
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#loginErr').textContent = msg || '';
  $('#pwInput').value = '';
}
function showApp(){
  $('#login').hidden = true;
  $('#app').hidden = false;
}
async function start(){
  if (!pw) { showLogin(''); return; }
  try {
    await loadAll();
    showApp();
    renderAll();
    if (pending.size === 0) setStatus('');
  } catch (e) {
    if (e.auth) showLogin('パスワードが違います');
    else if (e.message === 'env') showLogin('サーバーの設定が足りません(Vercelの環境変数を確認してください)');
    else showLogin('読み込めませんでした。通信を確認して、もう一度開いてください。');
  }
}
$('#loginBtn').addEventListener('click', function(){
  var v = $('#pwInput').value.trim();
  if (!v) return;
  pw = v;
  try { localStorage.setItem('shift_pw', pw); } catch(e) {}
  start();
});
$('#pwInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#loginBtn').click(); });
$('#logout').addEventListener('click', async function(){
  await flush();
  try { localStorage.removeItem('shift_pw'); } catch(e) {}
  pw = '';
  showLogin('');
});

document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    tab = b.dataset.tab;
    renderAll();
  });
});

async function goMonth(delta){
  await flush();
  if (pending.size) return;
  if (delta === 0) { now = new Date(); ym = {y: now.getFullYear(), m: now.getMonth() + 1}; }
  else {
    var d = new Date(ym.y, ym.m - 1 + delta, 1);
    ym = {y: d.getFullYear(), m: d.getMonth() + 1};
  }
  try { await loadMonth(); renderAll(); }
  catch (e) { setStatus('読み込めません', 'err'); }
}
$('#prev').addEventListener('click', function(){ goMonth(-1); });
$('#next').addEventListener('click', function(){ goMonth(1); });
$('#today').addEventListener('click', function(){ goMonth(0); });

document.addEventListener('visibilitychange', async function(){
  if (document.hidden || $('#app').hidden || pending.size || !$('#sheetBg').hidden) return;
  try { await loadAll(); renderAll(); } catch(e) {}
});

/* ---------- 描画 ---------- */
function renderAll(){
  $('#monthLabel').textContent = ym.y + '年' + ym.m + '月';
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
  });
  $('#view-grid').hidden = tab !== 'grid';
  $('#view-cal').hidden = tab !== 'cal';
  $('#view-staff').hidden = tab !== 'staff';
  $('.monthnav').hidden = tab === 'staff';
  if (tab === 'grid') renderGrid();
  if (tab === 'cal') renderCal();
  if (tab === 'staff') renderStaff();
}

function renderLegend(){
  $('#legend').innerHTML = STATUS.map(function(s){
    return '<span class="cell ' + s.c + '" style="width:auto;height:auto;font-size:12px;padding:2px 8px;border-radius:6px">' + s.s + ' ' + esc(s.v) + '</span>';
  }).join('');
}

function renderGrid(){
  renderLegend();
  var n = daysIn();
  var h = '<table class="grid"><thead><tr class="r1"><th class="name" rowspan="2">名前</th>';
  var d, wd, closed;
  for (d = 1; d <= n; d++) {
    wd = new Date(ym.y, ym.m - 1, d).getDay();
    closed = !!month.closed[d];
    h += '<th colspan="2" class="day wd' + wd + (closed ? ' closed' : '') + (isToday(d) ? ' today' : '') + '">' +
         '<button class="daybtn" data-act="closed" data-d="' + d + '" aria-label="' + ym.m + '月' + d + '日 休業日の切り替え">' +
         d + '<small>' + WD[wd] + '</small></button></th>';
  }
  h += '</tr><tr class="r2">';
  for (d = 1; d <= n; d++) h += '<th>AM</th><th>PM</th>';
  h += '</tr></thead><tbody>';
  staff.forEach(function(p){
    h += '<tr><th class="name">' + esc(p.name) + (p.memo ? '<small>' + esc(p.memo) + '</small>' : '') + '</th>';
    for (d = 1; d <= n; d++) {
      closed = !!month.closed[d];
      ['AM','PM'].forEach(function(ap){
        var v = month.shifts[d + '|' + p.id + '|' + ap];
        var st = statusOf(v);
        h += '<td class="' + (ap === 'AM' ? 'am' : '') + (closed ? ' closed' : '') + '">' +
             '<button class="cell ' + (st ? st.c : '') + '" data-act="cell" data-d="' + d + '" data-id="' + p.id + '" data-ap="' + ap + '"' +
             ' aria-label="' + esc(p.name) + ' ' + ym.m + '月' + d + '日 ' + ap + '">' + (st ? st.s : '') + '</button></td>';
      });
    }
    h += '</tr>';
  });
  h += '</tbody></table>';
  var wrap = $('#gridWrap');
  var sl = wrap.scrollLeft, stp = wrap.scrollTop;
  wrap.innerHTML = h;
  wrap.scrollLeft = sl; wrap.scrollTop = stp;
}

$('#gridWrap').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'closed') {
    var d = b.dataset.d;
    if (month.closed[d]) delete month.closed[d]; else month.closed[d] = true;
    queue(mkey(), month);
    renderGrid();
  } else if (b.dataset.act === 'cell') {
    openSheet(b);
  }
});

/* ---------- 選択シート ---------- */
function openSheet(btn){
  var p = staff.filter(function(x){ return x.id === btn.dataset.id; })[0];
  if (!p) return;
  target = {d: btn.dataset.d, id: p.id, ap: btn.dataset.ap, btn: btn};
  var wd = new Date(ym.y, ym.m - 1, +target.d).getDay();
  $('#sheetTitle').textContent = p.name;
  $('#sheetSub').textContent = ym.m + '月' + target.d + '日(' + WD[wd] + ') ' + target.ap;
  var cur = month.shifts[target.d + '|' + target.id + '|' + target.ap] || '';
  var h = STATUS.map(function(s){
    return '<button class="opt ' + s.c + (cur === s.v ? ' now' : '') + '" data-v="' + esc(s.v) + '">' + esc(s.v) + '</button>';
  }).join('');
  h += '<button class="opt clear' + (cur === '' ? ' now' : '') + '" data-v="">空にする</button>';
  $('#opts').innerHTML = h;
  $('#sheetBg').hidden = false;
}
function closeSheet(){ $('#sheetBg').hidden = true; target = null; }
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheetBg').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('#sheetBg').hidden) closeSheet(); });
$('#opts').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b || !target) return;
  var v = b.dataset.v;
  var key = target.d + '|' + target.id + '|' + target.ap;
  if (v) month.shifts[key] = v; else delete month.shifts[key];
  var st = statusOf(v);
  target.btn.className = 'cell ' + (st ? st.c : '');
  target.btn.textContent = st ? st.s : '';
  queue(mkey(), month);
  closeSheet();
});

/* ---------- カレンダー ---------- */
function renderCal(){
  var n = daysIn();
  var first = new Date(ym.y, ym.m - 1, 1).getDay();
  var off = (first + 6) % 7;
  var heads = ['月','火','水','木','金','土','日'];
  var h = heads.map(function(w, i){ return '<div class="wh' + (i === 6 ? ' sun' : i === 5 ? ' sat' : '') + '">' + w + '</div>'; }).join('');
  var i, d;
  for (i = 0; i < off; i++) h += '<div class="d blank"></div>';
  for (d = 1; d <= n; d++) {
    var wd = new Date(ym.y, ym.m - 1, d).getDay();
    var closed = !!month.closed[d];
    h += '<div class="d' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (closed ? ' closed' : '') + (isToday(d) ? ' today' : '') + '">' +
         '<div class="n">' + d + '</div>';
    if (closed) {
      h += '<div class="off">休み</div>';
    } else {
      ['AM','PM'].forEach(function(ap){
        var names = staff.filter(function(p){ return month.shifts[d + '|' + p.id + '|' + ap] === '出勤'; })
                         .map(function(p){ return esc(p.name.replace(/(さん|ちゃん|くん)$/, '')); });
        h += '<div class="row ' + ap.toLowerCase() + '"><b>' + ap + '</b>' + names.join('・') + '</div>';
      });
    }
    h += '</div>';
  }
  $('#cal').innerHTML = h;
}

/* ---------- スタッフ ---------- */
function renderStaff(){
  var h = staff.map(function(p, i){
    return '<div class="staff-row" data-id="' + p.id + '">' +
      '<input data-f="name" value="' + esc(p.name) + '" aria-label="名前">' +
      '<div class="btns">' +
        '<button data-act="up" aria-label="上へ"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button data-act="down" aria-label="下へ"' + (i === staff.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="del" data-act="del">削除</button>' +
      '</div>' +
      '<input class="memo" data-f="memo" value="' + esc(p.memo || '') + '" placeholder="メモ(任意)" aria-label="メモ">' +
    '</div>';
  }).join('');
  $('#staffList').innerHTML = h || '<p class="hint">スタッフがいません。下から追加してください。</p>';
}
$('#staffList').addEventListener('change', function(e){
  var row = e.target.closest('.staff-row');
  if (!row || !e.target.dataset.f) return;
  var p = staff.filter(function(x){ return x.id === row.dataset.id; })[0];
  if (!p) return;
  var v = e.target.value.trim();
  if (e.target.dataset.f === 'name' && !v) { e.target.value = p.name; return; }
  p[e.target.dataset.f] = v;
  queue('staff', staff);
});
$('#staffList').addEventListener('click', function(e){
  var b = e.target.closest('button');
  var row = e.target.closest('.staff-row');
  if (!b || !row) return;
  var idx = -1;
  staff.forEach(function(x, i){ if (x.id === row.dataset.id) idx = i; });
  if (idx < 0) return;
  if (b.dataset.act === 'up' && idx > 0) {
    var t = staff[idx - 1]; staff[idx - 1] = staff[idx]; staff[idx] = t;
  } else if (b.dataset.act === 'down' && idx < staff.length - 1) {
    var t2 = staff[idx + 1]; staff[idx + 1] = staff[idx]; staff[idx] = t2;
  } else if (b.dataset.act === 'del') {
    if (!confirm(staff[idx].name + 'を削除しますか?\nこの人のシフトも表示されなくなります。')) return;
    staff.splice(idx, 1);
  } else { return; }
  queue('staff', staff);
  renderStaff();
});
$('#addBtn').addEventListener('click', function(){
  var inp = $('#newName');
  var v = inp.value.trim();
  if (!v) return;
  staff.push({id:newId(), name:v, memo:''});
  inp.value = '';
  queue('staff', staff);
  renderStaff();
});
$('#newName').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#addBtn').click(); });

start();
})();
</script>
</body>
</html>
